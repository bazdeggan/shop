<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Магазин</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0506;--card:#1a0c0f;--card2:#25111500;--line:#3a1a1f;--tx:#f6eaea;--mut:#a58a8c;--r1:#ff2a3d;--r2:#b0001a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 40% at 50% 0,#3a0710 0,var(--bg) 60%) no-repeat,var(--bg);color:var(--tx);font:600 15px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px 14px 90px}
.top{display:flex;gap:10px}.s{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:22px;padding:0 16px;box-shadow:inset 0 2px 8px #000}
.s input{flex:1;background:none;border:0;color:var(--tx);font:inherit;height:46px;outline:0}
.ib{width:46px;height:46px;border-radius:16px;border:0;background:var(--card);color:var(--tx);font-size:20px}
.ban{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px -14px;padding:0 14px;scrollbar-width:none}
.ban>div{flex:0 0 92%;scroll-snap-align:center;min-height:150px;border-radius:20px;padding:18px;background:linear-gradient(135deg,var(--r2),#2a0509) center/cover;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.ban b{font-size:24px}.ban span{opacity:.85;font-weight:500}
h2{font-size:18px;margin:6px 2px 12px}
.cats{display:flex;gap:10px;overflow-x:auto;margin:0 -14px 18px;padding:0 14px;scrollbar-width:none}
.cat{flex:0 0 auto;background:var(--card);border:1px solid transparent;border-radius:22px;padding:14px 20px;color:var(--tx);font:inherit}
.cat.on{border-color:var(--r1);background:#2a0c11}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p{background:var(--card);border-radius:24px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px #0008}
.ph{aspect-ratio:1;border-radius:18px;background:#fff center/contain no-repeat;display:grid;place-items:center;font-size:42px;overflow:hidden}
.ph.e{background:linear-gradient(135deg,#3a0710,#14070a)}
.p .n{margin-top:4px;min-height:38px}.p .pr{color:var(--mut)}
.tag{align-self:center;background:#ffffff0d;border-radius:14px;padding:5px 14px;font-weight:500;color:var(--mut);font-size:13px}
.b{border:0;border-radius:22px;padding:13px;color:#fff;font:inherit;background:linear-gradient(135deg,var(--r1),var(--r2));margin-top:auto}
.b.off{background:#3a1a1f;color:var(--mut)}
.bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none}
.bar .b{width:100%;box-shadow:0 8px 30px #ff2a3d55;padding:16px}
.sh{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}.sh.on{display:flex}
.sh>div{background:#180a0d;width:100%;max-height:85%;overflow:auto;border-radius:24px 24px 0 0;padding:20px}
.o{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.o i{width:20px;height:20px;border:2px solid var(--r1);border-radius:50%;flex:none}.o.on i{background:radial-gradient(var(--r1) 50%,transparent 55%)}
.ci{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ci span{flex:1}
.q{width:34px;height:34px;border-radius:12px;border:0;background:var(--card);color:var(--tx);font-size:18px}
.age{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:30px}
.age h1{font-size:44px;color:var(--r1)}.age .b{width:100%;max-width:300px}
.em{text-align:center;color:var(--mut);padding:40px 0;grid-column:1/-1}
:focus-visible{outline:2px solid var(--r1);outline-offset:2px}

body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.01em;padding:18px 18px 110px}
.glow{position:fixed;top:0;left:0;right:0;height:130px;background:radial-gradient(70% 100% at 50% 0,#ff2a3d66,transparent 72%);pointer-events:none}
.top,.ban,.dots,h2,.cats,.g{position:relative}
.s{border-radius:30px;background:#140a0c;box-shadow:inset 4px 4px 10px #040102,inset -2px -2px 8px #1c0d10;padding:0 22px}
.s input{height:58px;font-weight:600}
.ib{width:58px;height:58px;border-radius:22px;display:grid;place-items:center;background:#1a0c0f;box-shadow:6px 6px 16px #040102,-2px -2px 8px #22101300}
.ban{margin:22px -18px 0;padding:0 18px}
.ban>div{flex:0 0 100%;min-height:170px;border-radius:28px;align-items:flex-start;box-shadow:0 10px 28px #0008}
.bt{margin-top:12px;background:#ffffff2e;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:0;color:var(--tx);border-radius:24px;padding:13px 26px;font:inherit}
.dots{display:flex;justify-content:center;gap:8px;margin:14px 0 26px}.dots i{width:7px;height:7px;border-radius:50%;background:#ffffff33}.dots i.on{background:var(--tx)}
h2{font-size:22px;margin:0 4px 16px}
.cats{gap:14px;margin:0 -18px 28px;padding:0 18px 6px}
.cc{flex:0 0 140px;height:180px;border-radius:32px;background:linear-gradient(160deg,#1f1013,#150a0c);box-shadow:8px 8px 20px #040102;color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:1.5px solid transparent}
.cc.on{border-color:var(--r1)}
.ci2{width:92px;height:92px;border-radius:50%;background:#000;display:grid;place-items:center;font-size:40px;box-shadow:0 0 24px #ff2a3d44}
.g{gap:16px}
.p{border-radius:36px;padding:16px 14px 18px;background:linear-gradient(160deg,#1f1013,#150a0c);box-shadow:8px 8px 22px #040102;gap:8px}
.ph{border-radius:28px;padding:12px;background-origin:content-box}
.p .n{font-size:17px;line-height:1.25;margin-top:6px}.p .pr{font-size:16px}
.b{padding:15px;border-radius:26px;box-shadow:0 6px 18px #ff2a3d33}.b.off{box-shadow:none}
.up{position:fixed;right:18px;width:60px;height:60px;border-radius:20px;border:0;background:#1c0e11f2;color:var(--tx);font-size:26px;display:none;z-index:4;box-shadow:6px 6px 18px #000a}
.sh{align-items:flex-start;background:#000b;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sh>div{border-radius:0 0 28px 28px;padding:26px 22px}.sh.bot{align-items:flex-end}.sh.bot>div{border-radius:28px 28px 0 0}
.bar .b{border-radius:28px}
</style></head><body><div class="glow"></div>
<div class="top"><label class="s">🔍<input id="q" placeholder="Я ищу..." autocomplete="off"></label><button class="ib" id="sortb" aria-label="Сортировка"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
<div class="ban" id="ban"></div><div class="dots" id="dots"></div><h2>Главная</h2><div class="cats" id="cats"></div><div class="g" id="g"></div>
<button class="up" id="up" aria-label="Наверх">↑</button><div class="bar" id="bar"><button class="b" id="cartb"></button></div>
<div class="sh" id="sh"><div id="shc"></div></div>
<div class="age" id="age" hidden><h1>18+</h1><p>Товары только для совершеннолетних. Вам есть 18 лет?</p><button class="b" id="yes">Да, мне есть 18</button><button class="cat" id="no">Нет</button></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#0a0506');tg.setBackgroundColor('#0a0506')}catch(e){}}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D,cat='',q='',sort='new',cart={};try{cart=JSON.parse(localStorage.getItem('cart')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}};
const cur=()=>D.shop.currency||'руб.',by=id=>D.products.find(p=>p.id===id);
const sum=()=>Object.entries(cart).reduce((s,[id,n])=>s+(by(id)?by(id).price*n:0),0),cnt=()=>Object.entries(cart).reduce((s,[id,n])=>s+(by(id)?n:0),0);
function openTg(text){const u='https://t.me/'+D.shop.tg.replace('@','')+'?text='+encodeURIComponent(text);tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank')}
const ic=n=>{n=n.toLowerCase();return n.includes('жидк')?'🧪':n.includes('однор')?'🔋':n.includes('под')?'📟':n.includes('расход')?'🔧':n==='все'?'✦':'🔥'};
function img(p){return p.img?`<div class="ph" style="background-image:url('${esc(p.img)}')"></div>`:`<div class="ph e">💨</div>`}
function render(){
 $('#ban').innerHTML=(D.shop.banners||[]).map((b,i)=>`<div style="${b.img?`background-image:linear-gradient(#0000,#000a),url('${esc(b.img)}')`:''}"><b>${esc(b.title)}</b><span>${esc(b.text)}</span><button class="bt" data-bt="${i}">Подробнее</button></div>`).join('');$('#dots').innerHTML=(D.shop.banners||[]).map((b,i)=>`<i class="${i?'':'on'}"></i>`).join('');
 $('#cats').innerHTML=['Все',...D.categories].map(c=>`<button class="cc ${(c==='Все'?'':c)===cat?'on':''}" data-c="${esc(c)}"><span class="ci2">${ic(c)}</span>${esc(c)}</button>`).join('');
 let l=D.products.filter(p=>(!cat||p.cat===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
 if(sort==='rating')l=[...l].sort((a,b)=>(b.rating||0)-(a.rating||0));if(sort==='asc')l=[...l].sort((a,b)=>a.price-b.price);if(sort==='desc')l=[...l].sort((a,b)=>b.price-a.price);
 $('#g').innerHTML=l.length?l.map(p=>`<div class="p">${img(p)}<div class="n">${esc(p.name)}</div><div class="pr">${p.price} ${esc(cur())}</div><div class="tag">${esc(p.cat)}</div>${p.stock?`<button class="b" data-a="${esc(p.id)}">В корзину</button>`:`<button class="b off" data-n="${esc(p.id)}">🔔 Сообщить о наличии</button>`}</div>`).join(''):'<div class="em">Ничего не найдено. Измените запрос или категорию.</div>';
 bar()}
function bar(){const n=cnt();$('#up').style.bottom=`calc(${n?92:18}px + env(safe-area-inset-bottom,0px))`;$('#bar').style.display=n?'block':'none';$('#cartb').textContent=`Корзина · ${n} шт · ${sum()} ${cur()}`}
function sheet(h,b){$('#shc').innerHTML=h;$('#sh').className='sh on'+(b?' bot':'')}
function cartView(){const e=Object.entries(cart).filter(([id])=>by(id));
 sheet(`<h2>Корзина</h2>${e.map(([id,n])=>{const p=by(id);return`<div class="ci"><span>${esc(p.name)}<br><small style="color:var(--mut)">${p.price*n} ${esc(cur())}</small></span><button class="q" data-m="${esc(id)}">−</button><b>${n}</b><button class="q" data-a="${esc(id)}">+</button></div>`}).join('')||'<div class="em">Корзина пуста. Добавьте товар из каталога.</div>'}${e.length?`<p style="margin:14px 0">Итого: ${sum()} ${esc(cur())}</p><button class="b" style="width:100%" data-ok="1">Оформить заказ</button>`:''}`,1)}
document.addEventListener('click',e=>{const t=e.target.closest('button,.o,.sh');if(!t)return;const d=t.dataset;
 if(t.id==='sh'&&e.target===t)return t.classList.remove('on');
 if(d.c!==undefined){cat=d.c==='Все'?'':d.c;render()}
 if(d.a){cart[d.a]=(cart[d.a]||0)+1;save();render();if($('#sh.on'))cartView()}
 if(d.m){cart[d.m]--;if(cart[d.m]<=0)delete cart[d.m];save();render();cartView()}
 if(d.n)openTg('Сообщите, когда появится: '+by(d.n).name);
 if(d.ok){openTg('Здравствуйте! Хочу оформить заказ:\n'+Object.entries(cart).filter(([id])=>by(id)).map(([id,n])=>`• ${by(id).name} × ${n} = ${by(id).price*n} ${cur()}`).join('\n')+`\nИтого: ${sum()} ${cur()}`)}
 if(d.s){sort=d.s;$('#sh').classList.remove('on');render()}
 if(t.id==='cartb')cartView();if(d.bt)openTg('Хочу узнать подробнее: '+D.shop.banners[d.bt].title);if(t.id==='up')scrollTo({top:0,behavior:'smooth'});
 if(t.id==='sortb')sheet('<h2>Сортировать по</h2>'+[['rating','По рейтингу'],['new','Новинки'],['asc','По возрастанию цены'],['desc','По убыванию цены']].map(([k,v])=>`<button class="o ${sort===k?'on':''}" data-s="${k}" style="width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);font:inherit;text-align:left"><i></i>${v}</button>`).join(''));
 if(t.id==='yes'){try{localStorage.setItem('age18','1')}catch(x){}$('#age').hidden=true}
 if(t.id==='no'){tg?tg.close():history.back()}});
$('#q').oninput=e=>{q=e.target.value;render()};
addEventListener('scroll',()=>{$('#up').style.display=scrollY>400?'block':'none'});
$('#ban').addEventListener('scroll',e=>{const b=e.target,w=b.firstElementChild?b.firstElementChild.offsetWidth+10:1,i=Math.round(b.scrollLeft/w);document.querySelectorAll('#dots i').forEach((x,k)=>x.classList.toggle('on',k===i))});
let ok=false;try{ok=localStorage.getItem('age18')==='1'}catch(e){}$('#age').hidden=ok;
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{D=d;document.title=d.shop.name;render()}).catch(()=>{$('#g').innerHTML='<div class="em">Не удалось загрузить каталог. Откройте приложение ещё раз.</div>'});
</script></body></html>
